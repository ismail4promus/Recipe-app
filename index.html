<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>iKitchen</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            // Theme-aware tokens driven by CSS variables. :root = dark (the
            // reference look); .light overrides to a warm light variant.
            // Channel form enables opacity modifiers (bg-app-primary/10).
            app: {
              bg: 'rgb(var(--c-bg) / <alpha-value>)',
              sidebar: 'rgb(var(--c-sidebar) / <alpha-value>)',
              card: 'rgb(var(--c-card) / <alpha-value>)',
              elevated: 'rgb(var(--c-elevated) / <alpha-value>)',
              primary: 'rgb(var(--c-primary) / <alpha-value>)',
              info: 'rgb(var(--c-info) / <alpha-value>)',
              success: 'rgb(var(--c-success) / <alpha-value>)',
              warning: 'rgb(var(--c-warning) / <alpha-value>)',
              danger: 'rgb(var(--c-danger) / <alpha-value>)',
              muted: 'rgb(var(--c-muted) / <alpha-value>)',
              text: 'rgb(var(--c-text) / <alpha-value>)',
              border: 'var(--c-border)',
            },
            border: 'var(--c-border)',
            background: 'rgb(var(--c-bg) / <alpha-value>)',
            foreground: 'rgb(var(--c-text) / <alpha-value>)',
            card: 'rgb(var(--c-card) / <alpha-value>)',
            'muted-foreground': 'rgb(var(--c-muted) / <alpha-value>)',
            primary: {
              DEFAULT: 'rgb(var(--c-primary) / <alpha-value>)',
              foreground: 'rgb(var(--c-primary-fg) / <alpha-value>)',
            }
          },
          borderRadius: {
            'sm': '0.5rem',
            'md': '0.75rem',
            'lg': '1rem',
            'xl': '1.25rem',
            '2xl': '1.5rem',
          },
          boxShadow: {
            soft: '0 2px 8px rgba(0,0,0,0.20)',
            card: '0 8px 28px -12px rgba(0,0,0,0.45)',
            float: '0 10px 30px -6px rgba(242,107,33,0.45)',
          },
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'system-ui', 'sans-serif'],
            bengali: ['"Hind Siliguri"', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          }
        }
      }
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@200..800&family=Hind+Siliguri:wght@300;400;500;600;700&family=JetBrains+Mono:wght@100..800&display=swap" rel="stylesheet">
  <style>
    /* ---- Dark theme (default, matches reference) ---- */
    :root {
      --c-bg: 16 16 16;           /* #101010 near-black */
      --c-sidebar: 22 22 22;      /* #161616 */
      --c-card: 28 28 28;         /* #1C1C1C */
      --c-elevated: 38 38 38;     /* #262626 list rows */
      --c-primary: 242 107 33;    /* #F26B21 vibrant orange */
      --c-primary-fg: 255 255 255;
      --c-info: 96 165 250;       /* #60A5FA */
      --c-success: 74 222 128;    /* #4ADE80 */
      --c-warning: 251 191 36;    /* #FBBF24 */
      --c-danger: 248 113 113;    /* #F87171 */
      --c-muted: 156 156 156;     /* #9C9C9C */
      --c-text: 245 245 245;      /* #F5F5F5 */
      --c-border: rgba(255, 255, 255, 0.08);
      --c-scrollbar: rgba(255, 255, 255, 0.16);
      color-scheme: dark;
    }

    /* ---- Light theme (toggle) ---- */
    .light {
      --c-bg: 250 247 242;        /* warm cream #FAF7F2 */
      --c-sidebar: 255 255 255;
      --c-card: 255 255 255;
      --c-elevated: 245 241 235;
      --c-primary: 242 107 33;    /* same orange */
      --c-primary-fg: 255 255 255;
      --c-info: 37 99 235;
      --c-success: 22 163 74;
      --c-warning: 180 83 9;
      --c-danger: 220 38 38;
      --c-muted: 120 116 110;
      --c-text: 26 24 22;         /* #1A1816 */
      --c-border: rgba(26, 24, 22, 0.10);
      --c-scrollbar: rgba(26, 24, 22, 0.20);
      color-scheme: light;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: rgb(var(--c-bg));
      color: rgb(var(--c-text));
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    h1, h2, h3, h4, h5, h6 {
      letter-spacing: -0.02em;
      font-weight: 700;
    }

    /* Softened from the old all-caps "tactical" style */
    .tactical-label {
      text-transform: uppercase;
      letter-spacing: 0.06em;
      font-size: 0.7rem;
      font-weight: 600;
      color: rgb(var(--c-muted));
    }

    .glass-panel {
      background: rgb(var(--c-card) / 0.72);
      backdrop-filter: blur(12px);
      border: 1px solid var(--c-border);
    }

    .status-pulse {
      width: 6px; height: 6px; border-radius: 50%;
      display: inline-block;
      animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: .4; transform: scale(1.2); }
    }

    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--c-scrollbar); border-radius: 8px; }
    ::-webkit-scrollbar-thumb:hover { background: rgb(var(--c-primary)); }

    .tabular-nums {
        font-variant-numeric: tabular-nums;
        font-family: 'JetBrains Mono', monospace;
    }

    @media (prefers-reduced-motion: reduce) {
      * { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
    }
  </style>
  <script type="importmap">
{
  "imports": {
    "framer-motion": "https://esm.sh/framer-motion@^12.23.26",
    "recharts": "https://esm.sh/recharts@^3.6.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "lucide-react": "https://esm.sh/lucide-react@^0.562.0",
    "firebase/": "https://esm.sh/firebase@^12.7.0/",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "react-router-dom": "https://esm.sh/react-router-dom@^7.11.0",
    "clsx": "https://esm.sh/clsx@^2.1.1",
    "xlsx": "https://esm.sh/xlsx@^0.18.5",
    "tailwind-merge": "https://esm.sh/tailwind-merge@^3.4.0"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
<body class="dark">
  <div id="root"></div>
<script type="module" src="/index.tsx"></script>
</body>
</html>
