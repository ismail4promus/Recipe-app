<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>iCooking</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            // Theme-aware tokens driven by CSS variables. :root = dark (the
            // reference look); .light overrides to a warm light variant.
            // Channel form enables opacity modifiers (bg-app-primary/10).
            app: {
              bg: 'rgb(var(--c-bg) / <alpha-value>)',
              secondary: 'rgb(var(--c-secondary) / <alpha-value>)',
              sidebar: 'rgb(var(--c-sidebar) / <alpha-value>)',
              card: 'rgb(var(--c-card) / <alpha-value>)',
              elevated: 'rgb(var(--c-elevated) / <alpha-value>)',
              primary: 'rgb(var(--c-primary) / <alpha-value>)',
              info: 'rgb(var(--c-info) / <alpha-value>)',
              success: 'rgb(var(--c-success) / <alpha-value>)',
              warning: 'rgb(var(--c-warning) / <alpha-value>)',
              danger: 'rgb(var(--c-danger) / <alpha-value>)',
              accent: 'rgb(var(--c-accent) / <alpha-value>)',
              muted: 'rgb(var(--c-muted) / <alpha-value>)',
              faint: 'rgb(var(--c-faint) / <alpha-value>)',
              text: 'rgb(var(--c-text) / <alpha-value>)',
              border: 'var(--c-border)',
            },
            border: 'var(--c-border)',
            background: 'rgb(var(--c-bg) / <alpha-value>)',
            foreground: 'rgb(var(--c-text) / <alpha-value>)',
            card: 'rgb(var(--c-card) / <alpha-value>)',
            'muted-foreground': 'rgb(var(--c-muted) / <alpha-value>)',
            primary: {
              DEFAULT: 'rgb(var(--c-primary) / <alpha-value>)',
              foreground: 'rgb(var(--c-primary-fg) / <alpha-value>)',
            }
          },
          // Soft, rounded design language: generous radii on every surface,
          // pill-shaped controls. `.squared` in index.css opts back out.
          borderRadius: {
            'none': '0px',
            'sm': '8px',
            DEFAULT: '12px',
            'md': '12px',
            'lg': '16px',
            'xl': '20px',
            '2xl': '24px',
            '3xl': '32px',
            'full': '9999px',
          },
          // Rounded surfaces carry their weight with wide, low-opacity blurs
          // instead of borders.
          boxShadow: {
            soft: '0 1px 2px rgba(20,45,38,0.04), 0 2px 8px -2px rgba(20,45,38,0.07)',
            card: '0 2px 4px rgba(20,45,38,0.04), 0 8px 24px -8px rgba(20,45,38,0.13)',
            float: '0 4px 8px rgba(20,45,38,0.05), 0 18px 40px -12px rgba(20,45,38,0.22)',
            inner: 'inset 0 1px 2px rgba(20,45,38,0.06)',
          },
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'system-ui', 'sans-serif'],
            bengali: ['"Hind Siliguri"', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          }
        }
      }
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@200..800&family=Hind+Siliguri:wght@300;400;500;600;700&family=JetBrains+Mono:wght@100..800&display=swap" rel="stylesheet">
  <style>
    /* ---- Light theme (default) — soft sage, cream cards, forest accents ---- */
    :root, .light {
      --c-bg: 238 243 240;        /* #EEF3F0 sage-tinted page */
      --c-secondary: 228 237 232; /* #E4EDE8 */
      --c-sidebar: 231 240 236;   /* #E7F0EC navigation */
      --c-card: 255 255 255;      /* #FFFFFF */
      --c-elevated: 247 246 240;  /* #F7F6F0 cream inner panels */
      --c-primary: 19 61 53;      /* #133D35 deep forest */
      --c-primary-fg: 255 255 255;
      --c-accent: 192 161 90;     /* #C0A15A gold */
      --c-info: 42 127 114;       /* #2A7F72 */
      --c-success: 46 158 119;    /* #2E9E77 */
      --c-warning: 216 154 43;    /* #D89A2B */
      --c-danger: 196 88 95;      /* #C4585F */
      --c-muted: 107 124 118;     /* #6B7C76 secondary text */
      --c-faint: 151 166 160;     /* #97A6A0 muted text */
      --c-text: 23 36 31;         /* #17241F */
      --c-border: #DDE7E2;
      --c-scrollbar: rgba(23, 36, 31, 0.18);
      color-scheme: light;
    }

    /* ---- Dark theme — deep forest, not pure black ---- */
    .dark {
      --c-bg: 22 33 29;           /* #16211D main */
      --c-secondary: 29 42 38;    /* #1D2A26 */
      --c-sidebar: 18 28 25;      /* #121C19 navigation */
      --c-card: 34 48 43;         /* #22302B */
      --c-elevated: 42 58 52;     /* #2A3A34 */
      --c-primary: 111 194 166;   /* #6FC2A6 sage green */
      --c-primary-fg: 16 32 27;   /* #10201B */
      --c-accent: 214 185 107;    /* #D6B96B gold */
      --c-info: 111 194 166;
      --c-success: 69 199 149;    /* #45C795 */
      --c-warning: 229 174 73;    /* #E5AE49 */
      --c-danger: 224 117 124;    /* #E0757C */
      --c-muted: 183 198 192;     /* #B7C6C0 secondary text */
      --c-faint: 127 145 139;     /* #7F918B muted text */
      --c-text: 242 246 244;      /* #F2F6F4 */
      --c-border: #33453E;
      --c-scrollbar: rgba(255, 255, 255, 0.16);
      color-scheme: dark;
    }

    /* First-use: respect device dark preference before JS applies a class */
    @media (prefers-color-scheme: dark) {
      :root:not(.light):not(.dark) {
        --c-bg: 22 33 29; --c-secondary: 29 42 38; --c-sidebar: 18 28 25;
        --c-card: 34 48 43; --c-elevated: 42 58 52;
        --c-primary: 111 194 166; --c-primary-fg: 16 32 27; --c-accent: 214 185 107;
        --c-info: 111 194 166; --c-success: 69 199 149; --c-warning: 229 174 73;
        --c-danger: 224 117 124; --c-muted: 183 198 192; --c-faint: 127 145 139;
        --c-text: 242 246 244; --c-border: #33453E;
        --c-scrollbar: rgba(255,255,255,0.16); color-scheme: dark;
      }
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: rgb(var(--c-bg));
      color: rgb(var(--c-text));
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    .app-shell-bg { background-color: rgb(var(--c-bg)); }

    h1, h2, h3, h4, h5, h6 {
      letter-spacing: -0.02em;
      font-weight: 700;
    }

    /* Softened from the old all-caps "tactical" style */
    .tactical-label {
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-size: 0.68rem;
      font-weight: 700;
      color: rgb(var(--c-faint));
    }

    .glass-panel {
      background: rgb(var(--c-card) / 0.78);
      backdrop-filter: blur(14px);
      border: 1px solid var(--c-border);
      border-radius: 20px;
    }

    .status-pulse {
      width: 6px; height: 6px; border-radius: 50%;
      display: inline-block;
      animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: .4; transform: scale(1.2); }
    }

    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--c-scrollbar); border-radius: 8px; }
    ::-webkit-scrollbar-thumb:hover { background: rgb(var(--c-primary)); }

    /* Mobile uses overlay/touch scrolling — reclaim the scrollbar gutter */
    @media (max-width: 767px) {
      ::-webkit-scrollbar { width: 0; height: 0; }
    }

    .tabular-nums {
        font-variant-numeric: tabular-nums;
        font-family: 'JetBrains Mono', monospace;
    }

    @media (prefers-reduced-motion: reduce) {
      * { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
    }
  </style>
  <script type="importmap">
{
  "imports": {
    "framer-motion": "https://esm.sh/framer-motion@^12.23.26",
    "recharts": "https://esm.sh/recharts@^3.6.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "lucide-react": "https://esm.sh/lucide-react@^0.562.0",
    "firebase/": "https://esm.sh/firebase@^12.7.0/",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "react-router-dom": "https://esm.sh/react-router-dom@^7.11.0",
    "clsx": "https://esm.sh/clsx@^2.1.1",
    "xlsx": "https://esm.sh/xlsx@^0.18.5",
    "tailwind-merge": "https://esm.sh/tailwind-merge@^3.4.0"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
<body>
  <div id="root"></div>
<script type="module" src="/index.tsx"></script>
</body>
</html>
