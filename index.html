<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>iCooking</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            // Theme-aware tokens driven by CSS variables. :root = dark (the
            // reference look); .light overrides to a warm light variant.
            // Channel form enables opacity modifiers (bg-app-primary/10).
            app: {
              bg: 'rgb(var(--c-bg) / <alpha-value>)',
              secondary: 'rgb(var(--c-secondary) / <alpha-value>)',
              sidebar: 'rgb(var(--c-sidebar) / <alpha-value>)',
              card: 'rgb(var(--c-card) / <alpha-value>)',
              elevated: 'rgb(var(--c-elevated) / <alpha-value>)',
              primary: 'rgb(var(--c-primary) / <alpha-value>)',
              info: 'rgb(var(--c-info) / <alpha-value>)',
              success: 'rgb(var(--c-success) / <alpha-value>)',
              warning: 'rgb(var(--c-warning) / <alpha-value>)',
              danger: 'rgb(var(--c-danger) / <alpha-value>)',
              muted: 'rgb(var(--c-muted) / <alpha-value>)',
              faint: 'rgb(var(--c-faint) / <alpha-value>)',
              text: 'rgb(var(--c-text) / <alpha-value>)',
              border: 'var(--c-border)',
            },
            border: 'var(--c-border)',
            background: 'rgb(var(--c-bg) / <alpha-value>)',
            foreground: 'rgb(var(--c-text) / <alpha-value>)',
            card: 'rgb(var(--c-card) / <alpha-value>)',
            'muted-foreground': 'rgb(var(--c-muted) / <alpha-value>)',
            primary: {
              DEFAULT: 'rgb(var(--c-primary) / <alpha-value>)',
              foreground: 'rgb(var(--c-primary-fg) / <alpha-value>)',
            }
          },
          // Squared-off design language: every surface is a crisp rectangle.
          // Genuinely circular things (spinners, status dots) opt back in with
          // the .circle utility in index.css.
          borderRadius: {
            'none': '0px',
            'sm': '0px',
            DEFAULT: '0px',
            'md': '0px',
            'lg': '0px',
            'xl': '0px',
            '2xl': '0px',
            '3xl': '0px',
            'full': '0px',
          },
          // Sharp edges need light, tight shadows — big soft blurs read as
          // rounded even when the corners are square.
          boxShadow: {
            soft: '0 1px 0 rgba(20,40,50,0.04), 0 1px 2px rgba(20,40,50,0.07)',
            card: '0 1px 0 rgba(20,40,50,0.05), 0 2px 8px -4px rgba(20,40,50,0.16)',
            float: '0 1px 0 rgba(20,40,50,0.06), 0 6px 16px -8px rgba(20,40,50,0.28)',
          },
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'system-ui', 'sans-serif'],
            bengali: ['"Hind Siliguri"', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          }
        }
      }
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@200..800&family=Hind+Siliguri:wght@300;400;500;600;700&family=JetBrains+Mono:wght@100..800&display=swap" rel="stylesheet">
  <style>
    /* ---- Light theme (default) — pale, airy, slightly blue ---- */
    :root, .light {
      --c-bg: 237 247 250;        /* #EDF7FA main */
      --c-secondary: 228 242 246; /* #E4F2F6 */
      --c-sidebar: 225 241 245;   /* #E1F1F5 navigation */
      --c-card: 255 255 255;      /* #FFFFFF */
      --c-elevated: 248 251 252;  /* #F8FBFC */
      --c-primary: 42 145 179;    /* #2A91B3 teal */
      --c-primary-fg: 255 255 255;
      --c-info: 42 145 179;       /* teal = information */
      --c-success: 32 184 131;    /* #20B883 */
      --c-warning: 243 154 35;    /* #F39A23 */
      --c-danger: 216 93 104;     /* #D85D68 */
      --c-muted: 100 116 125;     /* #64747D secondary text */
      --c-faint: 152 166 172;     /* #98A6AC muted text */
      --c-text: 32 42 51;         /* #202A33 */
      --c-border: #D8E5E9;
      --c-scrollbar: rgba(32, 42, 51, 0.20);
      color-scheme: light;
    }

    /* ---- Dark theme — charcoal blue, not pure black ---- */
    .dark {
      --c-bg: 39 50 58;           /* #27323A main */
      --c-secondary: 48 61 69;    /* #303D45 */
      --c-sidebar: 37 48 57;      /* #253039 navigation */
      --c-card: 55 70 78;         /* #37464E */
      --c-elevated: 61 77 85;     /* #3D4D55 */
      --c-primary: 40 163 204;    /* #28A3CC teal */
      --c-primary-fg: 255 255 255;
      --c-info: 40 163 204;       /* teal */
      --c-success: 40 201 145;    /* #28C991 */
      --c-warning: 245 160 42;    /* #F5A02A */
      --c-danger: 224 105 114;    /* #E06972 */
      --c-muted: 194 205 210;     /* #C2CDD2 secondary text */
      --c-faint: 135 150 158;     /* #87969E muted text */
      --c-text: 246 248 249;      /* #F6F8F9 */
      --c-border: #46565E;
      --c-scrollbar: rgba(255, 255, 255, 0.16);
      color-scheme: dark;
    }

    /* First-use: respect device dark preference before JS applies a class */
    @media (prefers-color-scheme: dark) {
      :root:not(.light):not(.dark) {
        --c-bg: 39 50 58; --c-secondary: 48 61 69; --c-sidebar: 37 48 57;
        --c-card: 55 70 78; --c-elevated: 61 77 85;
        --c-primary: 40 163 204; --c-primary-fg: 255 255 255; --c-info: 40 163 204;
        --c-success: 40 201 145; --c-warning: 245 160 42; --c-danger: 224 105 114;
        --c-muted: 194 205 210; --c-faint: 135 150 158; --c-text: 246 248 249;
        --c-border: #46565E; --c-scrollbar: rgba(255,255,255,0.16); color-scheme: dark;
      }
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: rgb(var(--c-bg));
      color: rgb(var(--c-text));
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    .app-shell-bg { background-color: rgb(var(--c-bg)); }

    h1, h2, h3, h4, h5, h6 {
      letter-spacing: -0.02em;
      font-weight: 700;
    }

    /* Softened from the old all-caps "tactical" style */
    .tactical-label {
      text-transform: uppercase;
      letter-spacing: 0.06em;
      font-size: 0.7rem;
      font-weight: 600;
      color: rgb(var(--c-muted));
    }

    .glass-panel {
      background: rgb(var(--c-card) / 0.72);
      backdrop-filter: blur(12px);
      border: 1px solid var(--c-border);
    }

    .status-pulse {
      width: 6px; height: 6px; border-radius: 50%;
      display: inline-block;
      animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: .4; transform: scale(1.2); }
    }

    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--c-scrollbar); border-radius: 8px; }
    ::-webkit-scrollbar-thumb:hover { background: rgb(var(--c-primary)); }

    /* Mobile uses overlay/touch scrolling — reclaim the scrollbar gutter */
    @media (max-width: 767px) {
      ::-webkit-scrollbar { width: 0; height: 0; }
    }

    .tabular-nums {
        font-variant-numeric: tabular-nums;
        font-family: 'JetBrains Mono', monospace;
    }

    @media (prefers-reduced-motion: reduce) {
      * { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
    }
  </style>
  <script type="importmap">
{
  "imports": {
    "framer-motion": "https://esm.sh/framer-motion@^12.23.26",
    "recharts": "https://esm.sh/recharts@^3.6.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "lucide-react": "https://esm.sh/lucide-react@^0.562.0",
    "firebase/": "https://esm.sh/firebase@^12.7.0/",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "react-router-dom": "https://esm.sh/react-router-dom@^7.11.0",
    "clsx": "https://esm.sh/clsx@^2.1.1",
    "xlsx": "https://esm.sh/xlsx@^0.18.5",
    "tailwind-merge": "https://esm.sh/tailwind-merge@^3.4.0"
  }
}
</script>

</head>

</html>
